<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOK & FIRE — Азиатская кухня</title>
    <!-- Подключаем шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-card: #181818;
            --accent-orange: #ff5500;
            --accent-glow: rgba(255, 85, 0, 0.4);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--accent-orange);
            font-weight: 700;
            letter-spacing: 2px;
        }

        nav a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent-orange);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Главный экран (Hero) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1552611052-33e04de081de?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 8vw, 80px);
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .hero h1 span {
            color: var(--accent-orange);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .hero p {
            font-size: clamp(16px, 2vw, 20px);
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 40px;
        }

        .btn {
            background-color: var(--accent-orange);
            color: var(--text-main);
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px var(--accent-orange);
        }

        /* Секция меню */
        .menu-section {
            padding: 100px 50px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 50px;
            font-family: 'Playfair Display', serif;
        }

        .section-title span {
            color: var(--accent-orange);
        }

        /* Фильтры */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-orange);
            color: var(--text-main);
            border-color: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Карточки блюд */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .menu-card {
            background-color: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-orange);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255,85,0,0.2);
        }

        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .order-btn {
            background: transparent;
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
        }

        .order-btn:hover {
            background: var(--accent-orange);
            color: var(--text-main);
        }

        /* Анимация появления */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Адаптив для мобилок */
        @media(max-width: 768px) {
            header { padding: 15px 20px; }
            nav { display: none; } /* Упрощено для примера */
            .menu-section { padding: 60px 20px; }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">WOK & FIRE</div>
        <nav>
            <a href="#menu">Меню</a>
            <a href="#about">О нас</a>
            <a href="#contacts">Контакты</a>
        </nav>
    </header>

    <!-- Главный блок -->
    <section class="hero">
        <h1>Вкус Азии с огоньком <span>WOK</span></h1>
        <p>Попробуйте аутентичные блюда китайской, японской и тайской кухни, приготовленные по традиционным рецептам с авторским акцентом.</p>
        <button class="btn" onclick="document.getElementById('menu').scrollIntoView({behavior: 'smooth'})">Смотреть меню</button>
    </section>

    <!-- Меню -->
    <section class="menu-section" id="menu">
        <h2 class="section-title">Наше <span>Меню</span></h2>
        
        <!-- Кнопки фильтрации -->
        <div class="filters">
            <button class="filter-btn active" data-category="all">Все</button>
            <button class="filter-btn" data-category="wok">WOK</button>
            <button class="filter-btn" data-category="sushi">Суши и Роллы</button>
            <button class="filter-btn" data-category="soup">Супы</button>
        </div>

        <!-- Контейнер для карточек (заполняется через JS) -->
        <div class="menu-grid" id="menu-grid"></div>
    </section>

    <!-- Подключаем скрипт -->
    <script src="script.js"></script>
</body>
</html>
